name: Release On Version Bump

on:
  push:
    branches:
    - master
  
  workflow_dispatch:
    inputs:
      force:
        description: Force build and release even when the version has not changed
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-on-version-bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
    
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
    
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
    
      - name: Install dependencies
        run: bun install --frozen-lockfile
    
      - name: Detect version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_RELEASE: ${{ inputs.force || false }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const { execFileSync } = require('node:child_process')
          const { readFileSync } = require('node:fs')
    
          const zeroSha = '0000000000000000000000000000000000000000'
          const beforeSha = process.env.BEFORE_SHA
          const forceRelease = process.env.FORCE_RELEASE === 'true'
    
          function readJson(filePath) {
            return JSON.parse(readFileSync(filePath, 'utf8'))
          }
    
          function readJsonAtRevision(revision, filePath) {
            try {
              const content = execFileSync(
                'git',
                ['show', `${revision}:${filePath}`],
                {
                  encoding: 'utf8',
                  timeout: 5000,
                },
              )
    
              return JSON.parse(content)
            } catch {
              return null
            }
          }
    
          const packageJson = readJson('package.json')
          const themeJson = readJson('komari-theme.json')
    
          if (packageJson.version !== themeJson.version) {
            console.error(
              `Version mismatch: package.json=${packageJson.version}, komari-theme.json=${themeJson.version}`,
            )
            process.exit(1)
          }
    
          const currentVersion = packageJson.version
    
          let previousVersion = ''
          let versionChanged = true
    
          // For normal push events, compare the current version with the
          // package.json version from the previous commit.
          if (beforeSha && beforeSha !== zeroSha) {
            const previousPackageJson = readJsonAtRevision(
              beforeSha,
              'package.json',
            )
    
            previousVersion = previousPackageJson?.version ?? ''
            versionChanged = previousVersion !== currentVersion
          }
    
          const shouldRelease = forceRelease || versionChanged
          const releaseTag = `v${currentVersion}`
    
          console.log(`current_version=${currentVersion}`)
          console.log(`previous_version=${previousVersion}`)
          console.log(`version_changed=${versionChanged}`)
          console.log(`force_release=${forceRelease}`)
          console.log(`should_release=${shouldRelease}`)
          console.log(`release_tag=${releaseTag}`)
    
          console.log(`version_changed=${versionChanged}`)
          console.log(`should_release=${shouldRelease}`)
          console.log(`release_tag=${releaseTag}`)
          NODE
    
      - name: Skip release
        if: steps.version.outputs.should_release != 'true'
        run: |
          echo "Version has not changed. Skipping release."
    
      - name: Build project
        if: steps.version.outputs.should_release == 'true'
        run: bun run build
    
      - name: Check release tag state
        if: steps.version.outputs.should_release == 'true'
        id: tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          git fetch --force --tags
    
          if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
    
            if [ "${TAG_SHA}" != "${CURRENT_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already exists on ${TAG_SHA}, not on ${CURRENT_SHA}." >&2
              echo "Refusing to move an existing release tag." >&2
              exit 1
            fi
    
            echo "Tag ${RELEASE_TAG} already exists on ${CURRENT_SHA}."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${RELEASE_TAG} does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
    
      - name: Create and push release tag
        if: steps.version.outputs.should_release == 'true' && steps.tag.outputs.exists == 'false'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"
    
      - name: Create or update GitHub release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            komari-theme-emerald-build*.zip
